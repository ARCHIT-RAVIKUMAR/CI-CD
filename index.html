<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Demo Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
    }

    .container {
      margin-top: 15%;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .badge {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      background: white;
      color: #333;
      border-radius: 25px;
      font-weight: bold;
    }

    .user {
      margin-top: 15px;
      font-size: 1rem;
      opacity: 0.85;
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚀 CI/CD Pipeline Working!</h1>
    <p>This website is automatically deployed using GitHub Actions.</p>

    <div class="badge">
      ✅ Deployment Successful
    </div>

    <div class="user">
      👤 architravikumar@mulearn
    </div>
  </div>

  <footer>
    Built with ❤️ by Archit Ravikumar
  </footer>
</body>
</html>
